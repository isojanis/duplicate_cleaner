name: Tests and packages
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgssapi-krb5-2
      - run: python -m pip install ".[portable,dev]"
      - run: python -m unittest discover -s tests -v
      - run: python -m duplicate_cleaner --smoke-test
      - run: python -m build
      - name: Validate built wheel outside checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -m duplicate_cleaner --smoke-test
  windows-executable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r packaging/windows/requirements-build.txt
      - run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DuplicateCleaner-windows-x64
          path: |
            dist/DuplicateCleaner-*-windows-x64.zip
            dist/DuplicateCleaner-*-windows-x64.zip.sha256
          if-no-files-found: error
